<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>malnut</title>
<style>
  :root{
    --bg:#0e1a12;
    --panel:#12241a;
    --panel-2:#16301f;
    --green:#7CFC9B;
    --green-soft:#a8ffc0;
    --green-dim:#3fa863;
    --text:#e8ffee;
    --muted:#8fbfa1;
    --glow: 0 0 10px rgba(124,252,155,.55), 0 0 24px rgba(124,252,155,.25);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #1c3a26 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #16301f 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    display:flex;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px;
    min-height:100vh;
    padding:26px 18px;
    background:linear-gradient(180deg,#10231a 0%, #0d1c14 100%);
    border-right:1px solid rgba(124,252,155,.18);
    display:flex;
    flex-direction:column;
    gap:14px;
    position:sticky;
    top:0;
  }

  .logo{
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
    color:var(--green);
    text-shadow:var(--glow);
    margin-bottom:18px;
    text-align:center;
  }

  .nav-btn{
    background:linear-gradient(145deg,#16301f,#10231a);
    color:var(--green-soft);
    border:1px solid rgba(124,252,155,.35);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    font-weight:600;
    letter-spacing:.4px;
    cursor:pointer;
    text-align:left;
    transition:.22s ease;
  }

  .nav-btn:hover{
    color:#04140a;
    background:linear-gradient(145deg,var(--green),var(--green-dim));
    box-shadow:var(--glow);
    transform:translateX(4px);
  }

  .nav-btn.active{
    color:#04140a;
    background:linear-gradient(145deg,var(--green),var(--green-dim));
    box-shadow:var(--glow);
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    padding:34px 40px;
    max-width:1100px;
  }

  .page{ display:none; animation:fade .35s ease; }
  .page.active{ display:block; }

  @keyframes fade{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  h1{
    font-size:30px;
    margin:0 0 6px;
    color:var(--green);
    text-shadow:var(--glow);
  }

  .sub{ color:var(--muted); margin-bottom:26px; font-size:14px; }

  .card{
    background:linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid rgba(124,252,155,.22);
    border-radius:16px;
    padding:22px;
    box-shadow:0 0 0 rgba(0,0,0,0), inset 0 0 30px rgba(124,252,155,.04);
  }

  /* ---------- Home ---------- */
  .home-grid{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:22px;
  }

  .clock{
    font-size:52px;
    font-weight:800;
    color:var(--green);
    text-shadow:var(--glow);
    letter-spacing:2px;
    text-align:center;
    margin:14px 0 6px;
  }

  .date{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    letter-spacing:.6px;
  }

  textarea{
    width:100%;
    min-height:190px;
    resize:vertical;
    background:#0b1710;
    border:1px solid rgba(124,252,155,.28);
    border-radius:12px;
    color:var(--text);
    padding:14px;
    font-size:14px;
    font-family:"Consolas", monospace;
    outline:none;
    transition:.2s;
  }

  textarea:focus{
    border-color:var(--green);
    box-shadow:var(--glow);
  }

  .save-btn{
    margin-top:12px;
    background:linear-gradient(145deg,var(--green),var(--green-dim));
    color:#04140a;
    border:none;
    border-radius:10px;
    padding:11px 22px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
    box-shadow:var(--glow);
  }

  .save-btn:hover{ filter:brightness(1.12); transform:translateY(-1px); }

  .saved-msg{
    margin-left:12px;
    color:var(--green-soft);
    font-size:13px;
    opacity:0;
    transition:.3s;
  }

  /* ---------- Tiles ---------- */
  .tiles{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:16px;
  }

  .tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    color:var(--green-soft);
    background:linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid rgba(124,252,155,.28);
    border-radius:14px;
    padding:24px 14px;
    font-weight:600;
    font-size:14px;
    transition:.22s ease;
  }

  .tile:hover{
    color:#04140a;
    background:linear-gradient(160deg,var(--green),var(--green-dim));
    box-shadow:var(--glow);
    transform:translateY(-4px);
  }

  .tile .emoji{ font-size:28px; }

  /* ---------- Info ---------- */
  .info-row{ margin-bottom:14px; font-size:15px; }
  .info-row span{ color:var(--green); font-weight:700; }
  a.mail{ color:var(--green-soft); }

  @media (max-width:820px){
    .home-grid{ grid-template-columns:1fr; }
    body{ flex-direction:column; }
    .sidebar{ width:100%; min-height:auto; flex-direction:row; flex-wrap:wrap; position:static; }
    .logo{ width:100%; margin-bottom:6px; }
    .main{ padding:24px 18px; }
  }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">malnut</div>
    <button class="nav-btn active" data-page="home">Home</button>
    <button class="nav-btn" data-page="games">Games</button>
    <button class="nav-btn" data-page="apps">Apps</button>
    <button class="nav-btn" data-page="info">Info</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HOME -->
    <section id="home" class="page active">
      <h1>Home</h1>
      <p class="sub">Welcome back.</p>
      <div class="home-grid">

        <div class="card">
          <div class="clock" id="clock">--:--:--</div>
          <div class="date" id="date">loading…</div>
        </div>

        <div class="card">
          <textarea id="notepad" placeholder="Write something…"></textarea>
          <button class="save-btn" id="saveBtn">Save</button>
          <span class="saved-msg" id="savedMsg">Saved ✓</span>
        </div>

      </div>
    </section>

    <!-- GAMES -->
    <section id="games" class="page">
      <h1>Games</h1>
      <p class="sub">Pick a game.</p>
      <div class="tiles">
        <a class="tile" href="https://www.roblox.com" target="_blank" rel="noopener"><span class="emoji">🟥</span>Roblox</a>
        <a class="tile" href="https://playtictactoe.org" target="_blank" rel="noopener"><span class="emoji">❌</span>Tic Tac Toe</a>
        <a class="tile" href="https://play2048.co" target="_blank" rel="noopener"><span class="emoji">🔢</span>2048</a>
        <a class="tile" href="https://buildnow.gg" target="_blank" rel="noopener"><span class="emoji">🧱</span>BuildNow.gg</a>
        <a class="tile" href="https://fridaynightfunkin.net" target="_blank" rel="noopener"><span class="emoji">🎤</span>Friday Night Funkin</a>
        <a class="tile" href="https://motox3m.com" target="_blank" rel="noopener"><span class="emoji">🏍️</span>Moto X3M</a>
      </div>
    </section>

    <!-- APPS -->
    <section id="apps" class="page">
      <h1>Apps</h1>
      <p class="sub">Quick links.</p>
      <div class="tiles">
        <a class="tile" href="https://www.tiktok.com" target="_blank" rel="noopener"><span class="emoji">🎵</span>TikTok</a>
        <a class="tile" href="https://www.youtube.com" target="_blank" rel="noopener"><span class="emoji">▶️</span>YouTube</a>
        <a class="tile" href="https://discord.com/app" target="_blank" rel="noopener"><span class="emoji">💬</span>Discord</a>
        <a class="tile" href="https://www.instagram.com" target="_blank" rel="noopener"><span class="emoji">📸</span>Instagram</a>
      </div>
    </section>

    <!-- INFO -->
    <section id="info" class="page">
      <h1>Info</h1>
      <p class="sub">About this site.</p>
      <div class="card">
        <div class="info-row">Made: <span>September 2026</span></div>
        <div class="info-row">Contact: <a class="mail" href="mailto:tyairp7@gmail.com">tyairp7@gmail.com</a></div>
      </div>
    </section>

  </main>

<script>
  /* ---------- Navigation ---------- */
  const navBtns = document.querySelectorAll(".nav-btn");
  const pages   = document.querySelectorAll(".page");

  navBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      navBtns.forEach(b => b.classList.remove("active"));
      pages.forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.page).classList.add("active");
    });
  });

  /* ---------- Live Clock ---------- */
  const clockEl = document.getElementById("clock");
  const dateEl  = document.getElementById("date");

  function tick(){
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString([], { hour12:false });
    dateEl.textContent  = now.toLocaleDateString([], {
      weekday:"long", year:"numeric", month:"long", day:"numeric"
    });
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Notepad ---------- */
  const notepad  = document.getElementById("notepad");
  const saveBtn  = document.getElementById("saveBtn");
  const savedMsg = document.getElementById("savedMsg");

  // load saved note
  notepad.value = localStorage.getItem("malnut-note") || "";

  saveBtn.addEventListener("click", () => {
    localStorage.setItem("malnut-note", notepad.value);
    savedMsg.style.opacity = "1";
    setTimeout(() => savedMsg.style.opacity = "0", 1500);
  });

  // autosave every 5s as a backup
  setInterval(() => {
    localStorage.setItem("malnut-note", notepad.value);
  }, 5000);
</script>
</body>
</html>
